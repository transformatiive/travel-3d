<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel 3D — 5 Lagos de Zermatt</title>
  <style>
    :root {
      --panel-bg: rgba(12, 18, 28, 0.82);
      --accent: #ffb340;
      --text: #eef3f8;
      --muted: #9fb0c3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a0f16; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: var(--text); }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* ---------- loading ---------- */
    #loading {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 40%, #16243a 0%, #0a0f16 75%);
      transition: opacity 0.8s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.04em; }
    #loading h1 span { color: var(--accent); }
    #loading .sub { color: var(--muted); font-size: 0.9rem; }
    #bar-wrap { width: min(420px, 70vw); height: 6px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; }
    #bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff8c1a, var(--accent)); border-radius: 3px; transition: width 0.2s ease; }
    #load-status { font-size: 0.8rem; color: var(--muted); }

    /* ---------- HUD ---------- */
    .hud { position: fixed; z-index: 10; user-select: none; }
    #title {
      top: 16px; left: 16px;
      background: var(--panel-bg); backdrop-filter: blur(8px);
      padding: 12px 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
    }
    #title h1 { font-size: 1.05rem; font-weight: 600; }
    #title h1 span { color: var(--accent); }
    #title p { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    #itinerary {
      top: 96px; left: 16px; width: 250px; max-height: calc(100vh - 200px); overflow-y: auto;
      background: var(--panel-bg); backdrop-filter: blur(8px);
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); padding: 10px;
    }
    #itinerary h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); padding: 4px 8px 8px; }
    .stop { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
    .stop:hover { background: rgba(255,255,255,0.08); }
    .stop.active { background: rgba(255, 179, 64, 0.18); }
    .stop .dot {
      width: 22px; height: 22px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; color: #10161f;
      background: var(--accent);
    }
    .stop .dot.lake { background: #5ec8f2; }
    .stop .info b { display: block; font-size: 0.85rem; font-weight: 600; }
    .stop .info small { color: var(--muted); font-size: 0.72rem; }

    #controls-hint {
      bottom: 16px; left: 50%; transform: translateX(-50%);
      background: var(--panel-bg); backdrop-filter: blur(8px);
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 16px; font-size: 0.75rem; color: var(--muted); text-align: center; white-space: nowrap;
    }
    #controls-hint b { color: var(--text); font-weight: 600; }
    kbd {
      display: inline-block; padding: 1px 6px; border-radius: 4px; margin: 0 1px;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.15);
      font-family: inherit; font-size: 0.72rem; color: var(--text);
    }

    #actions { top: 16px; right: 16px; display: flex; gap: 8px; }
    .btn {
      background: var(--panel-bg); backdrop-filter: blur(8px); color: var(--text);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      padding: 10px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: rgba(40, 56, 80, 0.9); }
    .btn.primary { background: var(--accent); color: #10161f; border-color: transparent; }
    .btn.primary:hover { background: #ffc46b; }
    .btn.active { border-color: var(--accent); color: var(--accent); }

    #crosshair {
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.85); box-shadow: 0 0 6px rgba(0,0,0,0.6);
      display: none; pointer-events: none;
    }
    body.pov #crosshair { display: block; }

    #compass {
      bottom: 16px; right: 16px; width: 64px; height: 64px; border-radius: 50%;
      background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
    }
    #compass .needle { font-size: 1.3rem; transition: transform 0.1s linear; }
    #compass .n { position: absolute; top: 4px; font-size: 0.6rem; color: var(--muted); }

    #altitude {
      bottom: 92px; right: 16px;
      background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; padding: 8px 12px; font-size: 0.8rem; text-align: right;
    }
    #altitude b { color: var(--accent); font-size: 0.95rem; }

    @media (max-width: 720px) {
      #itinerary { display: none; }
      #controls-hint { white-space: normal; width: 90vw; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="loading">
    <h1>Travel <span>3D</span></h1>
    <div class="sub">5-Seen-Wanderung · Zermatt, Suíça — a carregar terreno real…</div>
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="load-status">a iniciar…</div>
  </div>

  <div id="title" class="hud">
    <h1>Rota dos <span>5 Lagos</span> — Zermatt</h1>
    <p>≈ 9,8 km · ≈ 3 h · Blauherd → Sunnegga</p>
  </div>

  <div id="actions" class="hud">
    <button id="btn-tour" class="btn primary">▶ Tour aéreo</button>
    <button id="btn-pov" class="btn">🥾 Modo POV</button>
    <button id="btn-orbit" class="btn">🛰 Órbita</button>
  </div>

  <div id="itinerary" class="hud">
    <h2>Itinerário</h2>
    <div id="stops"></div>
  </div>

  <div id="controls-hint" class="hud"></div>

  <div id="altitude" class="hud"><b id="alt-value">—</b> m<br /><small id="mode-label">órbita</small></div>
  <div id="compass" class="hud"><span class="n">N</span><span class="needle" id="needle">⬆</span></div>
  <div id="crosshair" class="hud"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
